<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="サーモン大遡上">
<meta name="theme-color" content="#0d3440">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}[hidden]{display:none!important}</style>
</head><body><title>サーモン大遡上</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Yusei+Magic&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* 鮮魚売り場のPOPと川の断面。黄色い値札と赤マジックのUIで、川の青緑に乗せる */
:root{
  --river:#0d3440;--river2:#14505f;--water:#1f7f95;--foam:#e9f7f4;
  --salmon:#ff8a5c;--roe:#e3170a;--pop:#ffe63b;--ink:#17242c;--paper:#fffdf4;--mute:#a9cdd2;
  --display:'Dela Gothic One','Hiragino Kaku Gothic StdN','Hiragino Sans',sans-serif;
  --tag:'Yusei Magic','Hiragino Maru Gothic ProN','Hiragino Sans',sans-serif;
  --body:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Sans',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;touch-action:manipulation}
body{background:var(--river);color:var(--foam);font-family:var(--body);font-weight:500;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:3px solid var(--pop);outline-offset:2px}
#app{position:relative;height:100%;overflow:hidden}
.view{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0}
.view[hidden]{display:none!important}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 値札 */
.pop{font-family:var(--display);background:var(--pop);color:var(--roe);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:.5em 1.1em;font-size:18px;line-height:1.2;transition:transform .08s,box-shadow .08s}
.pop:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.pop:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.pop[disabled]{background:#c7d3d3;color:#5b6b70;cursor:default}
.pop.ghost{background:var(--paper);color:var(--ink)}

/* タイトル */
#v-title{background:var(--river)}
#parade{position:absolute;inset:0;width:100%;height:100%}
.title-box{position:relative;margin:auto;padding-block:24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px;width:100%}
.title-box h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(46px,12vw,112px);line-height:1.02;color:var(--salmon);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:5px 6px 0 var(--ink);transform:rotate(-2.5deg);letter-spacing:.01em;text-wrap:balance}
.title-box p{margin:0;font-family:var(--tag);font-size:clamp(17px,3.4vw,24px);color:var(--ink);background:var(--pop);border:3px solid var(--ink);padding:.15em .7em;transform:rotate(1.2deg)}

/* メニュー */
#v-menu{background:var(--river)}
.topbar{display:flex;align-items:center;gap:10px;padding-block:10px;background:var(--ink);flex:none}
.topbar .logo{font-family:var(--display);color:var(--salmon);font-size:17px;white-space:nowrap}
.purse{margin-left:auto;display:flex;align-items:center;gap:6px;font-family:var(--tag);font-size:19px;color:var(--pop);font-variant-numeric:tabular-nums;white-space:nowrap}
.purse b{font-weight:400}
.purse i{width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd3c2 0 18%,#f0431f 22%);border:2px solid #000;display:inline-block}
.icon{width:36px;height:36px;border:2px solid #4b6470;border-radius:50%;font-size:13px;color:var(--foam);flex:none}
.tabs{display:flex;background:var(--ink);gap:4px;flex:none;padding-bottom:0}
.tabs button{flex:1;min-width:0;padding:9px 4px 11px;font-weight:900;font-size:15px;color:var(--mute);background:#20333c;border-radius:8px 8px 0 0}
.tabs button[aria-selected="true"]{background:var(--river);color:var(--pop)}
.scroll{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.pane{max-width:1000px;margin:0 auto;padding-block:16px 40px}
.pane[hidden]{display:none}
h2{font-family:var(--display);font-weight:400;font-size:21px;margin:0}

/* マップ */
.laps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.laps button{font-family:var(--tag);font-size:15px;padding:5px 12px;border:2px solid var(--mute);border-radius:99px;color:var(--mute)}
.laps button[aria-pressed="true"]{background:var(--pop);color:var(--ink);border-color:var(--pop)}
.river{position:relative;display:flex;flex-direction:column;gap:10px;padding-left:44px}
.river::before{content:"";position:absolute;left:15px;top:0;bottom:0;width:16px;background:repeating-linear-gradient(0deg,#3fb3c6 0 18px,#2a97ac 18px 36px);border-left:3px solid var(--ink);border-right:3px solid var(--ink)}
.ch-head{display:flex;align-items:baseline;gap:10px;margin-top:12px;flex-wrap:wrap}
.ch-head span{font-family:var(--tag);color:var(--mute);font-size:15px}
.st{position:relative;display:grid;grid-template-columns:62px minmax(0,1fr) auto;align-items:center;gap:12px;background:var(--paper);color:var(--ink);border:3px solid var(--ink);padding:9px 12px;box-shadow:3px 3px 0 #06181f}
.st::before{content:"";position:absolute;left:-38px;top:50%;width:22px;height:22px;margin-top:-11px;border-radius:50%;background:#f0431f;border:3px solid var(--ink)}
.st.locked{background:#30505a;color:#8fb0b6;box-shadow:none;border-color:#1e3a44}
.st.locked::before{background:#30505a}
.st.next{background:var(--pop)}
.st.done::before{background:var(--paper)}
.km{font-family:var(--tag);font-size:22px;line-height:1;text-align:right;color:var(--roe);font-variant-numeric:tabular-nums}
.km small{font-size:12px;display:block;margin-top:2px}
.st.locked .km{color:inherit}
.st-main{min-width:0}
.st-name{font-weight:900;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.st-sub{font-size:12.5px;display:flex;gap:2px;flex-wrap:wrap;align-items:center;margin-top:3px;min-height:28px}
.st-sub canvas{width:28px;height:28px;display:block}
.st-sub em{font-style:normal;margin-left:6px;font-family:var(--tag);font-size:14px}
.go{font-family:var(--body);font-weight:900;font-size:16px;padding:.45em .8em;box-shadow:3px 3px 0 var(--ink)}
.stamp{font-weight:900;color:var(--roe);border:2px solid var(--roe);padding:0 5px;font-size:12px;transform:rotate(-8deg);display:inline-block;margin-left:6px;vertical-align:1px}

/* いけす */
.team{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:10px 0 18px;max-width:480px}
.tslot{aspect-ratio:1;background:#0a2730;border:2px dashed #3f6470;position:relative;display:block}
.tslot.on{background:var(--paper);border:3px solid var(--ink)}
.tslot canvas{width:100%;height:100%;display:block}
.ike{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px}
.cell{position:relative;background:var(--paper);color:var(--ink);border:3px solid var(--ink);padding:2px 2px 4px;display:flex;flex-direction:column;align-items:center;min-width:0}
.cell canvas{width:100%;aspect-ratio:1;display:block}
.cell .nm{font-size:10.5px;font-weight:700;line-height:1.15;height:2.3em;overflow:hidden;text-align:center;display:flex;align-items:center}
.cell.sel{outline:3px solid var(--pop);outline-offset:1px}
.cell.r-SR{background:#ffe9a8}.cell.r-UR{background:#2a2730;color:#ffe9a8}
.cell.lock{background:#30505a;color:#8fb0b6;border-color:#1e3a44}
.cell .lv{position:absolute;left:3px;top:2px;font-family:var(--tag);font-size:12px}
.cell .in{position:absolute;right:2px;top:2px;background:var(--roe);color:#fff;font-weight:900;font-size:10px;padding:0 4px}
.detail{background:var(--paper);color:var(--ink);border:3px solid var(--ink);box-shadow:4px 4px 0 #06181f;padding:14px;position:sticky;top:12px}
.detail .head{display:flex;gap:10px;align-items:center}
.detail canvas{width:104px;height:104px;flex:none}
.detail h3{margin:0;font-family:var(--display);font-weight:400;font-size:20px;line-height:1.2;overflow-wrap:anywhere}
.detail .rar{font-family:var(--tag);font-size:14px;color:var(--roe)}
.detail p{margin:8px 0;font-size:14px;line-height:1.6}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 10px;margin:8px 0;font-size:13px}
.stats div{display:flex;justify-content:space-between;gap:4px;border-bottom:1px solid #d7d3bf;font-variant-numeric:tabular-nums}
.stats b{font-weight:900}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.chips span{background:var(--ink);color:var(--pop);font-size:12px;padding:2px 7px;font-weight:700}
.detail .act{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.detail .act .pop{font-family:var(--body);font-weight:900;font-size:15px;box-shadow:3px 3px 0 var(--ink);flex:1 1 auto}
.metas{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:10px}
.meta{background:#0a2730;border:2px solid #3f6470;padding:10px;display:flex;flex-direction:column;gap:6px}
.meta b{font-weight:900;font-size:16px}
.meta small{color:var(--mute);font-size:13px}
.meta .pop{font-family:var(--body);font-weight:900;font-size:14px;box-shadow:3px 3px 0 #000;align-self:flex-start}
h2.mt{margin-top:26px}

/* 回転レーン */
.lanebox{background:#2a2730;border:3px solid var(--ink);overflow:hidden;position:relative;height:96px;margin:12px 0}
.belt{position:absolute;left:0;top:0;bottom:0;width:calc(100% + 150px);display:flex;gap:40px;padding-top:16px;background:repeating-linear-gradient(90deg,#494350 0 34px,#3a3541 34px 38px);animation:belt 3.6s linear infinite}
.belt.fast{animation-duration:.5s}
@keyframes belt{to{transform:translateX(-150px)}}
.plate{flex:none;width:110px;height:60px;position:relative}
.plate::before{content:"";position:absolute;left:0;right:0;bottom:6px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink)}
.plate.g::before{background:#f6c93a}.plate.k::before{background:#201c24}
.plate::after{content:"";position:absolute;left:30px;right:30px;bottom:18px;height:22px;background:var(--salmon);border:3px solid var(--ink);border-radius:50% 50% 30% 30%}
.gacha{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
.rates{font-size:14px;line-height:1.9}
.rates b{font-family:var(--tag);font-weight:400;color:var(--pop);margin-left:6px}
.reveal{background:var(--paper);color:var(--ink);border:3px solid var(--ink);box-shadow:4px 4px 0 #06181f;padding:14px;text-align:center;min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.reveal canvas{width:150px;height:150px}
.reveal.r-SR{background:#ffe9a8}.reveal.r-UR{background:#2a2730;color:#ffe9a8}
.reveal h3{margin:0;font-family:var(--display);font-weight:400;font-size:21px}
.reveal .tagline{font-family:var(--tag);color:var(--roe);font-size:16px}
.reveal.r-UR .tagline{color:var(--pop)}
.reveal.pulse{animation:pop .35s}
@keyframes pop{0%{transform:scale(.7)}70%{transform:scale(1.05)}100%{transform:scale(1)}}

/* バトル */
#v-battle{background:#000}
.field{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;cursor:grab}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding-top:8px;pointer-events:none}
.hud>*{pointer-events:auto}
#hud-stage{font-family:var(--tag);font-size:15px;color:var(--foam);background:rgba(13,52,64,.82);padding:3px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#hud-money{margin-left:auto;font-family:var(--tag);font-size:20px;color:var(--roe);background:var(--pop);border:2px solid var(--ink);padding:1px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
#hud-money small{font-size:13px;color:var(--ink)}
.hbtn{width:38px;height:32px;background:var(--paper);color:var(--ink);border:2px solid var(--ink);font-weight:900;font-size:15px;flex:none}
.panel{flex:none;background:var(--ink);display:grid;grid-template-columns:96px minmax(0,1fr) 96px;gap:8px;padding-block:8px}
.slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.slot{position:relative;height:66px;background:var(--paper);border:2px solid #000;overflow:hidden;min-width:0;display:block}
.slot canvas{position:absolute;left:0;right:0;top:1px;width:100%;height:calc(100% - 18px);object-fit:contain}
.slot .price{position:absolute;left:0;right:0;bottom:0;height:18px;background:var(--pop);color:var(--roe);font-family:var(--tag);font-size:14px;line-height:18px;border-top:2px solid #000;text-align:center;font-variant-numeric:tabular-nums}
.slot .wait{position:absolute;left:0;right:0;top:0;bottom:18px;background:rgba(10,30,38,.66);display:none}
.slot.cooling .wait{display:block}
.slot .sec{position:absolute;left:0;right:0;top:0;bottom:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--tag);font-size:22px;line-height:1;font-style:normal;font-variant-numeric:tabular-nums}
.slot .bar{position:absolute;left:0;right:0;bottom:0;height:10px;background:#06181f;border-top:2px solid #000}
.slot .bar i{display:block;height:100%;background:#4fe3f5;transform-origin:left;transform:scaleX(var(--c,0))}
.slot.flash{animation:slotready .3s}
@keyframes slotready{from{background:var(--pop)}}
.slot kbd{position:absolute;left:3px;top:1px;font:700 10px var(--body);color:#6b7a80}
.slot.cooling kbd{color:#c7d3d3}
.slot.poor canvas{filter:grayscale(1) brightness(.75)}
.slot.poor .price{background:#c7d3d3;color:#5b6b70}
.slot.empty{background:#22353e;border-color:#22353e;cursor:default}
.big{position:relative;border:2px solid #000;background:var(--paper);color:var(--ink);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;min-width:0;text-align:center}
.big b{font-weight:900;font-size:16px;line-height:1.15;position:relative}
.big small{font-family:var(--tag);font-size:14px;position:relative;font-variant-numeric:tabular-nums;line-height:1.2}
.big .fill{position:absolute;left:0;bottom:0;top:0;width:calc(var(--c,0)*100%);background:#7fd9e6}
.big.ready{background:var(--pop);animation:ready .7s infinite alternate}
.big.ready .fill{display:none}
.big.off{opacity:.6}
@keyframes ready{to{background:#fff27a}}
.over{position:absolute;inset:0;background:rgba(6,24,31,.72);display:flex;align-items:center;justify-content:center;z-index:5;padding-block:16px}
.over[hidden]{display:none}
.card{background:var(--paper);color:var(--ink);border:4px solid var(--ink);box-shadow:7px 7px 0 #000;max-width:440px;width:100%;padding:20px;display:flex;flex-direction:column;gap:12px;text-align:center;max-height:100%;overflow:auto}
.card h2{font-size:clamp(28px,7vw,40px);color:var(--roe);transform:rotate(-1.5deg)}
.card p{margin:0;line-height:1.7;font-size:15px}
.card .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.card canvas{width:110px;height:110px;align-self:center}
.card .prize{font-family:var(--tag);font-size:22px;color:var(--roe)}
#tip{position:absolute;left:50%;top:64px;transform:translateX(-50%);background:var(--paper);color:var(--ink);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:8px 12px;font-size:14px;line-height:1.5;width:min(420px,calc(100% - 32px));text-align:left;cursor:pointer}
#toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--pop);font-family:var(--tag);padding:6px 14px;border:2px solid var(--pop);z-index:9;white-space:nowrap}

@media (max-width:760px){
  .ike{grid-template-columns:minmax(0,1fr)}
  .detail{position:static;order:-1}
  .gacha{grid-template-columns:minmax(0,1fr)}
  .panel{grid-template-columns:1fr 1fr}
  .panel .slots{grid-column:1/-1;grid-row:2}
  .big{height:46px;flex-direction:row;gap:8px}
  .slot{height:62px}
}
@media (max-height:480px){
  .panel{grid-template-columns:82px minmax(0,1fr) 82px;padding-block:5px}
  .panel .slots{grid-column:auto;grid-row:auto;grid-template-columns:repeat(10,minmax(0,1fr))}
  .big{height:auto;flex-direction:column;gap:0}
  .slot{height:58px}
  .slot kbd{display:none}
}
@media (prefers-reduced-motion:reduce){.belt,.big.ready,.reveal.pulse,.slot.flash{animation:none}}
</style>

<div id="app">
  <section class="view" id="v-title">
    <canvas id="parade" aria-hidden="true"></canvas>
    <div class="title-box gut">
      <h1>サーモン<br>大遡上</h1>
      <p>生まれた川まで、あと268km。</p>
      <button class="pop" id="btn-start">川をのぼる</button>
    </div>
  </section>

  <section class="view" id="v-menu" hidden>
    <div class="topbar gut">
      <span class="logo">サーモン大遡上</span>
      <span class="purse" title="イクラ"><i></i><b id="purse">0</b></span>
      <button class="icon" id="btn-snd" aria-label="音の切り替え">音</button>
    </div>
    <div class="tabs gut" role="tablist">
      <button role="tab" id="tab-map" data-tab="map">川をのぼる</button>
      <button role="tab" id="tab-ike" data-tab="ike">いけす</button>
      <button role="tab" id="tab-lane" data-tab="lane">回転レーン</button>
    </div>
    <div class="scroll gut" id="scroll">
      <div class="pane" id="p-map"></div>
      <div class="pane" id="p-ike" hidden></div>
      <div class="pane" id="p-lane" hidden></div>
    </div>
  </section>

  <section class="view" id="v-battle" hidden>
    <div class="field" id="field">
      <canvas id="cv"></canvas>
      <div class="hud gut">
        <span id="hud-stage"></span>
        <span id="hud-money"></span>
        <button class="hbtn" id="btn-speed" aria-label="ゲーム速度">×1</button>
        <button class="hbtn" id="btn-pause" aria-label="一時停止">止</button>
      </div>
      <div id="tip" hidden></div>
    </div>
    <div class="panel gut">
      <button class="big" id="btn-stom"><i class="fill"></i><b>胃袋 Lv1</b><small></small></button>
      <div class="slots" id="slots"></div>
      <button class="big" id="btn-flood"><i class="fill"></i><b>鉄砲水</b><small></small></button>
    </div>
    <div class="over gut" id="over" hidden><div class="card" id="over-card"></div></div>
  </section>
  <div id="toast" hidden></div>
</div>

<script>window.SALMON=(()=>{
'use strict';
const VH=330,WATER_Y=205,GROUND=282,KB_T=.55;
const TRAIT={fish:'川魚',shell:'カニ',bird:'鳥',beast:'ケモノ',human:'ヒト'};
const LAPS=[{n:'1回目の遡上',m:1,r:1},{n:'4年後の遡上',m:2.5,r:2},{n:'8年後の遡上',m:6,r:3.5}];
const RARE={N:'基本',R:'白皿',SR:'金皿',UR:'黒皿'};

const UNITS={
shake:{n:'シロザケ',r:'N',via:'start',cost:50,cd:2,hp:150,atk:18,rate:1,wind:.3,range:34,sp:42,kb:3,w:40,fx:'bite',
  txt:'いちばんふつうの鮭。秋になるとだいたい帰ってくる。'},
ikura:{n:'イクラ三兄弟',r:'N',via:'start',cost:30,cd:1.4,hp:50,atk:8,rate:.8,wind:.2,range:26,sp:56,kb:1,w:20,count:3,fx:'bite',
  txt:'3粒で1組。兄弟はあと3000粒ほどいる。'},

const STOM={max:8,income:l=>14+9*(l-1),cap:l=>500+300*(l-1),cost:l=>40+80*l};
const lvMul=l=>1+.2*(l-1);
const lvCost=l=>Math.round(40*Math.pow(l,1.55));
const META={
wall:{n:'ふ化場の壁',txt:'拠点の体力 +20%',max:10},
flood:{n:'鉄砲水',txt:'たまる時間 -3秒、威力 +50%',max:8},
stom:{n:'オキアミの群れ',txt:'オキアミの収入 +8%',max:10},
};
const metaCost=l=>Math.round(150*Math.pow(l+1,1.4));
function battleCfg(save){
  return{slots:save.team.map(id=>({id,lv:save.own[id]})),
    baseHp:Math.round(1500*(1+.2*save.meta.wall)),
    floodNeed:Math.max(20,50-3*save.meta.flood),
    floodDmg:Math.round(260*(1+.5*save.meta.flood)),
    income:1+.08*save.meta.stom};
}

function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

class Battle{
  constructor(si,lap,cfg,seed){
    const s=STAGES[si];this.s=s;this.si=si;this.lap=lap;this.cfg=cfg;this.L=s.len;this.time=0;this.over=null;
    this.mul=LAPS[lap].m;this.rand=mulberry(seed??(Math.random()*1e9|0));
    this.pbase={isBase:1,side:1,x:this.L-74,w:96,hp:cfg.baseHp,max:cfg.baseHp,shake:0};
    const eb=Math.round(s.base*this.mul);
    this.ebase={isBase:1,side:-1,x:74,w:96,hp:eb,max:eb,shake:0};
    this.money=0;this.stom=1;this.us=[];this.es=[];this.fx=[];this.queue=[];this.wave=null;
    this.slots=cfg.slots.map(x=>({id:x.id,lv:x.lv,def:UNITS[x.id],cd:0}));
    this.flood={c:0,need:cfg.floodNeed,dmg:cfg.floodDmg};
    this.rules=s.rules.map(r=>({...r,on:false,cnt:0,next:0}));
    this.kills=0;
  }
  get income(){return STOM.income(this.stom)*this.cfg.income}
  get cap(){return STOM.cap(this.stom)}
  canDeploy(i){const s=this.slots[i];return s&&!this.over&&s.cd<=0&&this.money>=s.def.cost&&this.us.length<40}
  deploy(i){
    if(!this.canDeploy(i))return false;
    const s=this.slots[i];this.money-=s.def.cost;s.cd=s.def.cd;
    const n=s.def.count||1;
    for(let k=0;k<n;k++)this.addUnit(s.id,s.lv,this.pbase.x-44-k*16);
    this.fx.push({k:'spawn',x:this.pbase.x-44,side:1});
    return true;
  }
  addUnit(id,lv,x){
    const d=UNITS[id],m=lvMul(lv);
    const e=this.make(d,1,x,d.hp*m,d.atk*m);e.shield=!!d.shield;e.lv=lv;e.id=id;
    this.us.push(e);return e;
  }
  addEnemy(id){
    const d=ENEMIES[id],m=this.mul;
    const e=this.make(d,-1,this.ebase.x+50,d.hp*m,d.atk*m);e.id=id;
    this.es.push(e);
    if(d.boss){this.fx.push({k:'boss',name:d.n});for(const u of this.us)this.knock(u);this.fx.push({k:'shock'});}
  }
  make(d,side,x,hp,atk){
    return{def:d,side,dir:-side,x,lane:this.rand()*16|0,hp,maxhp:hp,atk,range:d.range,w:d.w,state:'move',timer:0,kbDone:0,
      walk:this.rand()*6,hurt:0,slow:0,stun:0,anim:0,lunge:0,alive:true,seed:this.rand()};
  }
  canUp(){return this.stom<STOM.max&&this.money>=STOM.cost(this.stom)&&!this.over}
  upStom(){if(!this.canUp())return false;this.money-=STOM.cost(this.stom);this.stom++;return true}
  canFire(){return this.flood.c>=this.flood.need&&!this.over&&!this.wave}
  fire(){if(!this.canFire())return false;this.flood.c=0;this.wave={x:this.pbase.x,hit:new Set()};this.fx.push({k:'wave'});return true}

  nearest(e){
    const d=e.dir,foes=e.side>0?this.es:this.us;let best=null,bd=1e9;
    for(const t of foes){
      if(!t.alive||t.state==='kb')continue;
      const dx=(t.x-e.x)*d;if(dx<-24)continue;
      const g=Math.max(0,dx-t.w/2);
      if(g<=e.range&&g<bd){bd=g;best=t}
    }
    const b=e.side>0?this.ebase:this.pbase,gap=(b.x-e.x)*d-b.w/2;
    if(gap<=e.range&&gap<bd)best=b;
    return best;
  }
  step(dt){
    if(this.over)return;
    this.time+=dt;
    this.money=Math.min(this.cap,this.money+this.income*dt);
    for(const s of this.slots)s.cd=Math.max(0,s.cd-dt);
    this.flood.c=Math.min(this.flood.need,this.flood.c+dt);
    this.pbase.shake=Math.max(0,this.pbase.shake-dt);this.ebase.shake=Math.max(0,this.ebase.shake-dt);
    const pct=this.ebase.hp/this.ebase.max*100;
    for(const r of this.rules){
      if(r.done)continue;
      if(!r.on){if(this.time>=r.t&&pct<=(r.hp??100)){r.on=true;r.next=0}else continue}
      r.next-=dt;
      if(r.next<=0){
        const b=r.b||1;
        for(let i=0;i<b;i++)this.queue.push({t:i*.45,fn:()=>{if(this.es.length<40)this.addEnemy(r.e)}});
        r.cnt++;r.next=r.ev;
        if(r.n&&r.cnt>=r.n)r.done=true;
      }
    }
    for(let i=this.queue.length-1;i>=0;i--){const q=this.queue[i];q.t-=dt;if(q.t<=0){this.queue.splice(i,1);q.fn()}}
    for(const e of this.us)this.act(e,dt);
    for(const e of this.es)this.act(e,dt);
    if(this.wave){
      const w=this.wave;w.x-=900*dt;
      for(const e of this.es)if(e.alive&&!w.hit.has(e)&&e.x>=w.x){
        w.hit.add(e);this.fx.push({k:'hit',x:e.x,y:GROUND-40,big:1});
        this.damage(e,this.flood.dmg*(1+this.mul*.4));if(e.alive)this.knock(e);
      }
      if(w.x<this.ebase.x)this.wave=null;
    }
    this.us=this.us.filter(e=>e.alive);this.es=this.es.filter(e=>e.alive);
    if(this.ebase.hp<=0){this.ebase.hp=0;this.over='win'}
    else if(this.pbase.hp<=0){this.pbase.hp=0;this.over='lose'}
  }
  act(e,dt){
    if(!e.alive)return;
    const d=e.def;e.anim+=dt;e.hurt=Math.max(0,e.hurt-dt);e.lunge=Math.max(0,e.lunge-dt*4);
    if(e.stun>0){e.stun-=dt;return}
    if(e.slow>0)e.slow-=dt;
    const sp=d.sp*(e.slow>0?.4:1);
    if(e.state==='kb'){
      e.timer-=dt;e.x-=e.dir*150*dt*Math.max(.15,e.timer/KB_T);
      e.x=Math.min(this.L-30,Math.max(30,e.x));
      if(e.timer<=0)e.state='move';
      return;
    }
    if(d.roll){
      e.walk+=dt*sp*.09;e.x+=e.dir*sp*dt;
      const edge=this.ebase.x+this.ebase.w/2+10;if(e.x<edge)e.x=edge;
      e.timer-=dt;
      if(e.timer<=0){
        const t=this.nearest(e);
        if(t){this.strike(e,t);e.timer=d.rate}
      }
      return;
    }
    if(e.state==='move'){
      if(this.nearest(e)){e.state='wind';e.timer=d.wind}
      else{e.x+=e.dir*sp*dt;e.walk+=dt*sp*.11}

    3(x){n.fillStyle='#2f6650';n.strokeStyle=INK;n.lineWidth=2;for(let i=0;i<3;i++){const h=46+R()*26;n.beginPath();n.moveTo(x+i*14-14,WATER_Y-16);n.lineTo(x+i*14,WATER_Y-16-h);n.lineTo(x+i*14+14,WATER_Y-16);n.closePath();n.fill();n.stroke()}},
    4(x){n.strokeStyle='#4c3425';n.lineWidth=5;n.beginPath();n.moveTo(x,WATER_Y-16);n.lineTo(x,WATER_Y-56);n.stroke();const c=['#d9402a','#e8842e','#e9b53a'];for(let i=0;i<5;i++){n.fillStyle=c[R()*3|0];n.strokeStyle=INK;n.lineWidth=1.8;n.beginPath();n.arc(x+(R()-.5)*44,WATER_Y-62-R()*30,17+R()*6,0,6.3);n.fill();n.stroke()}},
  }[ch];
  for(let x=170;x<L-170;x+=ch===1?230:130+R()*130)props(x);
  g=n.createLinearGradient(0,WATER_Y,0,GROUND+10);g.addColorStop(0,pal.water[0]);g.addColorStop(1,pal.water[1]);
  n.fillStyle=g;n.fillRect(0,WATER_Y,L,GROUND-WATER_Y+12);
  n.fillStyle=pal.bed;n.fillRect(0,GROUND+8,L,VH-GROUND);
  n.strokeStyle=INK;n.lineWidth=2;n.beginPath();n.moveTo(0,GROUND+8);for(let x=0;x<=L;x+=24)n.lineTo(x,GROUND+8+Math.sin(x*.05)*2.2);n.stroke();
  for(let i=0;i<L/7;i++){const x=R()*L,y=GROUND+14+R()*34,r=2+R()*5;n.fillStyle=['#9c8d7a','#857766','#b3a692','#6f6355'][R()*4|0];n.beginPath();n.ellipse(x,y,r*1.5,r,0,0,6.3);n.fill();if(r>4.5){n.lineWidth=1.2;n.strokeStyle='rgba(23,36,44,.5)';n.stroke()}}
  return{far,near,pal};
}

})();
</script>
<script>(()=>{
'use strict';
const G=window.SALMON,A=window.SALMON_ART;
const{VH,WATER_Y,GROUND,TRAIT,LAPS,RARE,UNITS,ENEMIES,CHAPTERS,STAGES,STOM,META,lvMul,lvCost,metaCost,battleCfg,Battle}=G;
const $=id=>document.getElementById(id);
const fmt=n=>Math.floor(n).toLocaleString('ja-JP');
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const KEY='salmon-run-v1',SPIN=200,MAXLV=20;
const fresh=()=>({ikura:300,own:{shake:1,ikura:1,aramaki:1},team:['shake','ikura','aramaki'],prog:[0,0,0],meta:{wall:0,flood:0,stom:0},lap:0,tip:false,snd:true});
let save=fresh();
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.own)save={...fresh(),...s}}catch(e){}
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}};

/* 音 */
const Snd={ac:null,timer:null,step:0,
  wake(){if(!save.snd)return;if(!this.ac){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;this.ac=new C()}if(this.ac.state!=='running')this.ac.resume();this.bgm()},
  tone(f,d=.1,type='triangle',v=.05,when=0,to){if(!this.ac||!save.snd)return;const t=this.ac.currentTime+when,o=this.ac.createOscillator(),g=this.ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g).connect(this.ac.destination);o.start(t);o.stop(t+d+.02)},
  noise(d=.3,v=.08,fc=900){if(!this.ac||!save.snd)return;const n=this.ac.sampleRate*d|0,b=this.ac.createBuffer(1,n,this.ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=this.ac.createBufferSource(),f=this.ac.createBiquadFilter(),g=this.ac.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=fc;g.gain.value=v;s.connect(f).connect(g).connect(this.ac.destination);s.start()},
  bgm(){if(this.timer)return;const sc=[262,294,330,392,440,523],pat=[0,2,4,2,3,1,2,0,4,5,4,2,3,2,1,0];
    this.timer=setInterval(()=>{if(!save.snd||document.hidden)return;const i=this.step++%32;if(i%2===0)this.tone(sc[pat[(i/2)%16]],.2,'triangle',.022);if(i%8===0)this.tone(sc[[0,3,2,3][(i/8)%4]]/2,.42,'sine',.04)},190)},
  stop(){clearInterval(this.timer);this.timer=null},
  spawn(){this.tone(520,.08,'square',.025,0,780)},hit(){this.noise(.05,.04,1600)},big(){this.tone(120,.2,'sawtooth',.06,0,50);this.noise(.15,.08,700)},
  flood(){this.noise(1.1,.16,520);this.tone(90,.9,'sawtooth',.05,0,40)},
  win(){[523,659,784,1046].forEach((f,i)=>this.tone(f,.26,'triangle',.07,i*.13))},lose(){[392,330,262,196].forEach((f,i)=>this.tone(f,.32,'triangle',.06,i*.17))},
  coin(){this.tone(880,.06,'square',.02);this.tone(1320,.09,'square',.02,.06)},
};

/* 立ち絵 */
const pCache={};
function measure(id){
  if(pCache[id])return pCache[id];
  const S=460,cv=document.createElement('canvas');cv.width=S;cv.height=S;
  const c=cv.getContext('2d',{willReadFrequently:true});c.translate(S/2,S-30);
  A.drawActor(c,id,{t:.7,sw:.4,atk:0,roll:.2});
  const d=c.getImageData(0,0,S,S).data;let x0=S,x1=0,y0=S,y1=0;
  for(let y=0;y<S;y+=2)for(let x=0;x<S;x+=2)if(d[(y*S+x)*4+3]>16){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
  return pCache[id]={cx:(x0+x1)/2-S/2,cy:(y0+y1)/2-(S-30),w:x1-x0+6,h:y1-y0+6};
}
function portrait(id,px,o={}){
  const cv=document.createElement('canvas'),dpr=2,S=px*dpr;cv.width=S;cv.height=S;
  const c=cv.getContext('2d'),m=measure(id),k=Math.min(S*.9/m.w,S*.9/m.h);
  c.translate(S/2,S/2);c.scale(k*(o.flip?-1:1),k);c.translate(-m.cx,-m.cy);
  A.drawActor(c,id,{t:.7,sw:.4,atk:0,roll:.2});
  if(o.dark){c.setTransform(1,0,0,1,0,0);c.globalCompositeOperation='source-in';c.fillStyle='#17303a';c.fillRect(0,0,S,S)}
  return cv;
}

/* 画面切り替え */
let view='title',tab='map',sel='shake';
function show(v){view=v;for(const k of['title','menu','battle'])$('v-'+k).hidden=k!==v;if(v==='menu')setTab(tab);if(v==='battle')fit()}
function setTab(t){tab=t;for(const b of document.querySelectorAll('.tabs button'))b.setAttribute('aria-selected',b.dataset.tab===t);
  for(const k of['map','ike','lane'])$('p-'+k).hidden=k!==t;({map:renderMap,ike:renderIke,lane:renderLane})[t]();$('purse').textContent=fmt(save.ikura)}
function refreshPurse(){$('purse').textContent=fmt(save.ikura)}
let toastT;function toast(s){const t=$('toast');t.textContent=s;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,1600)}

/* マップ */
function enemiesOf(s){const seen=[];for(const r of s.rules)if(!seen.includes(r.e))seen.push(r.e);return seen}
function renderMap(){
  const lap=save.lap,prog=save.prog[lap],p=$('p-map');p.innerHTML='';
  const laps=document.createElement('div');laps.className='laps';
  LAPS.forEach((l,i)=>{if(i&&save.prog[i-1]<STAGES.length)return;const b=document.createElement('button');b.textContent=i?`${l.n}(敵の強さ ×${l.m})`:l.n;b.setAttribute('aria-pressed',i===lap);b.onclick=()=>{save.lap=i;persist();renderMap()};laps.appendChild(b)});
  if(laps.children.length>1)p.appendChild(laps);
  const riv=document.createElement('div');riv.className='river';let chShown=-1,nextEl=null;
  for(let i=STAGES.length-1;i>=0;i--){
    const s=STAGES[i],locked=i>prog,done=i<prog;
    if(s.ch!==chShown){chShown=s.ch;const c=CHAPTERS[s.ch],h=document.createElement('div');h.className='ch-head';h.innerHTML=`<h2>${c.n}</h2><span>${c.sub}</span>`;riv.appendChild(h)}
    const el=document.createElement('div');el.className='st'+(locked?' locked':done?' done':' next');
    const km=document.createElement('div');km.className='km';km.innerHTML=`${s.km}<small>km</small>`;
    const main=document.createElement('div');main.className='st-main';
    const nm=document.createElement('div');nm.className='st-name';nm.textContent=locked?'まだ見えない':s.n;
    if(done){const st=document.createElement('span');st.className='stamp';st.textContent='済';nm.appendChild(st)}
    main.appendChild(nm);
    if(!locked){const sub=document.createElement('div');sub.className='st-sub';for(const e of enemiesOf(s))sub.appendChild(portrait(e,28,{flip:1}));const em=document.createElement('em');em.textContent=`報酬 ${fmt(reward(i,lap,!done))}`;sub.appendChild(em);main.appendChild(sub)}
    el.append(km,main);
    if(!locked){const b=document.createElement('button');b.className='pop go';b.textContent='遡上';b.onclick=()=>startBattle(i,lap);el.appendChild(b)}
    riv.appendChild(el);if(i===prog)nextEl=el;
  }
  p.appendChild(riv);
  if(nextEl)requestAnimationFrame(()=>nextEl.scrollIntoView({block:'center'}));
}
const reward=(i,lap,first)=>Math.round(STAGES[i].reward*LAPS[lap].r*(first?1:.5));

/* いけす */
function abilityChips(d){
  const a=[];
  if(d.count)a.push(`${d.count}体で出撃`);
  if(d.area)a.push('範囲攻撃');
  if(d.range>=90&&!d.heal)a.push('遠くまで届く');
  if(d.vs)for(const[k,v]of Object.entries(d.vs))a.push(`${TRAIT[k]}に${v}倍`);
  if(d.crit)a.push(`トロの一撃 ${d.crit*100}%`);
  if(d.slow)a.push('敵を遅くする');
  if(d.stun)a.push(`敵を止める ${d.stun.p*100}%`);
  if(d.kbc)a.push(`吹き飛ばす ${d.kbc*100}%`);
  if(d.heal)a.push(`仲間を回復 ${d.heal*100}%`);
  if(d.roll)a.push('止まらず転がる');
  if(d.shield)a.push('一度だけ耐える');
  if(d.onDeath)a.push('倒れるとイクラ6粒');
  return a;
}
const unlockHint=d=>d.via==='gacha'?'回転レーンで出ることがある':d.via.clear!==undefined?`「${STAGES[d.via.clear].n}」をクリア`:'';
function renderIke(){
  const p=$('p-ike');p.innerHTML='';
  const h=document.createElement('h2');h.textContent=`出撃する${save.team.length}組(最大10)`;p.appendChild(h);
  const team=document.createElement('div');team.className='team';
  for(let i=0;i<10;i++){const id=save.team[i],b=document.createElement('button');b.className='tslot'+(id?' on':'');if(id){b.appendChild(portrait(id,64));b.setAttribute('aria-label',`${UNITS[id].n}を見る`);b.onclick=()=>{sel=id;renderIke()}}else{b.disabled=true;b.setAttribute('aria-label','空き')}team.appendChild(b)}
  p.appendChild(team);
  const wrap=document.createElement('div');wrap.className='ike';
  const grid=document.createElement('div');grid.className='grid';
  const order=Object.keys(UNITS);
  for(const id of order){const d=UNITS[id],own=save.own[id],b=document.createElement('button');
    b.className=`cell r-${d.r}${own?'':' lock'}${sel===id?' sel':''}`;
    b.appendChild(portrait(id,84,{dark:!own}));
    const n=document.createElement('span');n.className='nm';n.textContent=own?d.n:'???';b.appendChild(n);
    if(own){const l=document.createElement('span');l.className='lv';l.textContent='Lv'+own;b.appendChild(l)}
    if(save.team.includes(id)){const l=document.createElement('span');l.className='in';l.textContent='出撃';b.appendChild(l)}
    b.onclick=()=>{sel=id;renderIke();document.querySelector('.detail').scrollIntoView({block:'nearest'})};grid.appendChild(b)}
  const det=document.createElement('div');det.className='detail';det.appendChild(detailOf(sel));
  wrap.append(grid,det);p.appendChild(wrap);
  const h2=document.createElement('h2');h2.className='mt';h2.textContent='ふ化場の強化';p.appendChild(h2);
  const ms=document.createElement('div');ms.className='metas';
  for(const[k,m]of Object.entries(META)){const l=save.meta[k],c=metaCost(l),el=document.createElement('div');el.className='meta';
    el.innerHTML=`<b>${m.n} Lv${l}</b><small>${m.txt}</small>`;
    const b=document.createElement('button');b.className='pop';b.textContent=l>=m.max?'最大':`イクラ ${fmt(c)} で強化`;b.disabled=l>=m.max||save.ikura<c;
    b.onclick=()=>{save.ikura-=c;save.meta[k]++;persist();Snd.coin();refreshPurse();renderIke()};el.appendChild(b);ms.appendChild(el)}
  p.appendChild(ms);
}
function detailOf(id){
  const d=UNITS[id],own=save.own[id],f=document.createDocumentFragment();
  const head=document.createElement('div');head.className='head';head.appendChild(portrait(id,104,{dark:!own}));
  const t=document.createElement('div');t.innerHTML=`<div class="rar">${RARE[d.r]}${own?` ・ Lv${own}`:''}</div><h3>${own?d.n:'まだ会っていない'}</h3>`;head.appendChild(t);f.appendChild(head);
  if(!own){const q=document.createElement('p');q.textContent=`出会い方:${unlockHint(d)}`;f.appendChild(q);return f}
  const q=document.createElement('p');q.textContent=d.txt;f.appendChild(q);
  const m=lvMul(own),st=document.createElement('div');st.className='stats';
  const rows=[['体力',fmt(d.hp*m)],['攻撃',d.heal?'-':fmt(d.atk*m)],['射程',d.range],['速さ',d.sp],['費用',d.cost],['再出撃',d.cd+'秒']];
  st.innerHTML=rows.map(r=>`<div><span>${r[0]}</span><b>${r[1]}</b></div>`).join('');f.appendChild(st);
  const ch=abilityChips(d);if(ch.length){const c=document.createElement('div');c.className='chips';c.innerHTML=ch.map(x=>`<span>${x}</span>`).join('');f.appendChild(c)}
  const act=document.createElement('div');act.className='act';
  const inTeam=save.team.includes(id),tg=document.createElement('button');tg.className='pop ghost';tg.textContent=inTeam?'出撃から外す':'出撃に入れる';
  tg.disabled=(!inTeam&&save.team.length>=10)||(inTeam&&save.team.length<=1);
  tg.onclick=()=>{if(inTeam)save.team=save.team.filter(x=>x!==id);else save.team.push(id);persist();renderIke()};
  const cost=lvCost(own),up=document.createElement('button');up.className='pop';up.textContent=own>=MAXLV?'最大レベル':`イクラ ${fmt(cost)} で強化`;up.disabled=own>=MAXLV||save.ikura<cost;
  up.onclick=()=>{save.ikura-=cost;save.own[id]++;persist();Snd.coin();refreshPurse();renderIke()};
  act.append(up,tg);f.appendChild(act);return f;
}

/* 回転レーン */
let spinning=false,lastPull=null;
function renderLane(){
  const p=$('p-lane');p.innerHTML='';
  const gachaIds=Object.keys(UNITS).filter(k=>UNITS[k].via==='gacha'),got=gachaIds.filter(k=>save.own[k]).length;
  const h=document.createElement('h2');h.textContent='回転レーン';p.appendChild(h);
  const lb=document.createElement('div');lb.className='lanebox';const belt=document.createElement('div');belt.className='belt';belt.id='belt';
  for(let i=0;i<12;i++){const pl=document.createElement('div');pl.className='plate'+(i%7===3?' k':i%3===1?' g':'');belt.appendChild(pl)}
  lb.appendChild(belt);p.appendChild(lb);
  const g=document.createElement('div');g.className='gacha';
  const left=document.createElement('div');
  left.innerHTML=`<p class="rates">流れてくる皿を1枚取ると、仲間が1組増えます。同じ仲間が出たらLvが1上がります。<br>白皿<b>65%</b>　金皿<b>28%</b>　黒皿<b>7%</b><br>集めた仲間<b>${got} / ${gachaIds.length}</b></p>`;
  const b=document.createElement('button');b.className='pop';b.id='btn-spin';b.textContent=`イクラ ${SPIN} で皿を取る`;b.disabled=save.ikura<SPIN;b.onclick=spin;left.appendChild(b);
  const rv=document.createElement('div');rv.id='reveal';rv.className='reveal';
  if(lastPull)fillReveal(rv,lastPull);else{const m=document.createElement('p');m.textContent='まだ皿を取っていません。';rv.appendChild(m)}
  g.append(left,rv);p.appendChild(g);
}
function fillReveal(rv,r){
  const d=UNITS[r.id];rv.className='reveal r-'+d.r;rv.innerHTML='';rv.appendChild(portrait(r.id,150));
  const h=document.createElement('h3');h.textContent=d.n;
  const t=document.createElement('div');t.className='tagline';t.textContent=r.isNew?`${RARE[d.r]}・はじめまして`:`${RARE[d.r]}・Lv${r.lv}に上がった`;
  const q=document.createElement('p');q.style.margin='4px 0 0';q.style.fontSize='14px';q.textContent=d.txt;rv.append(t,h,q);
}
function spin(){
  if(spinning||save.ikura<SPIN)return;
  spinning=true;save.ikura-=SPIN;refreshPurse();Snd.coin();
  const belt=$('belt'),btn=$('btn-spin');belt.classList.add('fast');btn.disabled=true;
  const roll=Math.random(),rar=roll<.07?'UR':roll<.35?'SR':'R';
  const pool=Object.keys(UNITS).filter(k=>UNITS[k].via==='gacha'&&UNITS[k].r===rar),id=pool[Math.random()*pool.length|0];
  setTimeout(()=>{
    const isNew=!save.own[id];
    save.own[id]=Math.min(MAXLV,(save.own[id]||0)+1);
    if(isNew&&save.team.length<10)save.team.push(id);
    persist();spinning=false;lastPull={id,isNew,lv:save.own[id]};sel=id;
    if(view==='menu'&&tab==='lane'){renderLane();$('reveal').classList.add('pulse')}
    Snd.win();
  },REDUCED?120:900);
}

/* バトル */
const cv=$('cv'),ctx=cv.getContext('2d'),field=$('field');
let B=null,bg=null,cam=0,vw=800,Sc=1,offY=0,dpr=1,vfx=[],speed=1,paused=false,userPan=0,flash=0,shakeT=0,clock=0,banner=null,endQueued=false;
function fit(){
  const r=field.getBoundingClientRect();if(!r.width)return;
  dpr=Math.min(window.devicePixelRatio||1,2);cv.width=r.width*dpr|0;cv.height=r.height*dpr|0;
  Sc=Math.min(r.height/VH,r.width/420);
  if(B)Sc=Math.max(Sc,r.width/B.L);
  vw=r.width/Sc;offY=r.height-VH*Sc;clampCam();
}
function clampCam(){if(B)cam=Math.max(0,Math.min(B.L-vw,cam))}
new ResizeObserver(fit).observe(field);
function startBattle(si,lap){
  B=new Battle(si,lap,battleCfg(save));bg=A.makeBackground(STAGES[si].ch,B.L,VH,WATER_Y,GROUND,CHAPTERS);
  vfx=[];slotCache=[];paused=false;userPan=0;endQueued=false;banner=null;speed=1;$('btn-speed').textContent='×1';$('over').hidden=true;
  $('hud-stage').textContent=`${STAGES[si].km}km ${STAGES[si].n}`;
  buildSlots();show('battle');fit();cam=B.L-vw;clampCam();
  const tip=$('tip');
  if(!save.tip){tip.hidden=false;tip.textContent='下の値札を押すと仲間が出ます。オキアミは時間でたまります。左の敵の拠点を壊せば勝ちです。画面を押してドラッグすると川を見渡せます。';tip.onclick=()=>{tip.hidden=true};save.tip=true;persist();setTimeout(()=>{tip.hidden=true},9000)}else tip.hidden=true;
}
// 指が触れた瞬間に反応させる。キーボード操作のclickはdetailが0になる
function press(el,fn){el.onpointerdown=e=>{if(e.pointerType!=='mouse'||e.button===0)fn()};el.onclick=e=>{if(e.detail===0)fn()}}
function buildSlots(){
  const w=$('slots');w.innerHTML='';
  B.slots.forEach((s,i)=>{const b=document.createElement('button');b.className='slot';b.id='slot-'+i;b.setAttribute('aria-label',`${s.def.n}を出す ${s.def.cost}オキアミ`);

  for(let pass=0;pass<3;pass++)for(const id of paradeIds){
    const w=id==='osuke'?300:id==='king'?190:gap;
    if(x>-260&&x<r.width+260){c.save();c.translate(x,base);c.scale(sc,sc);A.drawActor(c,id,{t:clock+x*.01,sw:Math.sin(clock*8+x),atk:0,roll:clock*5});c.restore()}
    x+=w;
  }
  c.lineWidth=3;c.strokeStyle='rgba(255,255,255,.8)';c.beginPath();for(let q=0;q<=r.width;q+=14){const y=wy+Math.sin(q*.03+clock*2)*3;q?c.lineTo(q,y):c.moveTo(q,y)}c.stroke();
}

let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000);last=now;clock+=dt;
  if(document.hidden)return;
  if(view==='battle')tickBattle(dt);else if(view==='title')drawParade();
}

$('btn-start').onclick=()=>{Snd.wake();show('menu')};
for(const b of document.querySelectorAll('.tabs button'))b.onclick=()=>setTab(b.dataset.tab);
const sndBtn=$('btn-snd');const sndLabel=()=>{sndBtn.textContent=save.snd?'音':'消';sndBtn.setAttribute('aria-pressed',save.snd)};sndLabel();
sndBtn.onclick=()=>{save.snd=!save.snd;persist();sndLabel();if(save.snd)Snd.wake();else Snd.stop()};
// iOSは指を離した時しか音を許可せず、アプリ切り替え後は音が止まるので毎回起こす
for(const ev of['touchend','pointerup'])addEventListener(ev,()=>Snd.wake(),{passive:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&view==='battle'&&B&&!B.over&&!paused)togglePause()});
show('title');
requestAnimationFrame(frame);
})();
</script>
