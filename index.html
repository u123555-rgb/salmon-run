<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="サーモン大遡上">
<meta name="theme-color" content="#0d3440">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}[hidden]{display:none!important}</style>
</head><body><title>サーモン大遡上</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Yusei+Magic&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* 鮮魚売り場のPOPと川の断面。黄色い値札と赤マジックのUIで、川の青緑に乗せる */
:root{
  --river:#0d3440;--river2:#14505f;--water:#1f7f95;--foam:#e9f7f4;
  --salmon:#ff8a5c;--roe:#e3170a;--pop:#ffe63b;--ink:#17242c;--paper:#fffdf4;--mute:#a9cdd2;
  --display:'Dela Gothic One','Hiragino Kaku Gothic StdN','Hiragino Sans',sans-serif;
  --tag:'Yusei Magic','Hiragino Maru Gothic ProN','Hiragino Sans',sans-serif;
  --body:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Sans',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;touch-action:manipulation}
body{background:var(--river);color:var(--foam);font-family:var(--body);font-weight:500;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:3px solid var(--pop);outline-offset:2px}
#app{position:relative;height:100%;overflow:hidden}
.view{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0}
.view[hidden]{display:none!important}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 値札 */
.pop{font-family:var(--display);background:linear-gradient(180deg,#fff27a,var(--pop) 60%);color:var(--roe);border:3px solid var(--ink);border-radius:10px;box-shadow:0 4px 0 var(--ink);padding:.5em 1.1em;font-size:18px;line-height:1.2;transition:transform .08s,box-shadow .08s}
.pop:hover{transform:translateY(-1px);box-shadow:0 5px 0 var(--ink)}
.pop:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.pop[disabled]{background:#c7d3d3;color:#5b6b70;cursor:default;transform:none}
.pop.ghost{background:var(--paper);color:var(--ink)}

/* タイトル */
#v-title{background:var(--river)}
#parade{position:absolute;inset:0;width:100%;height:100%}
.title-box{position:relative;margin:auto;padding-block:24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px;width:100%}
.title-box h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(46px,12vw,112px);line-height:1.02;color:var(--salmon);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:5px 6px 0 var(--ink);transform:rotate(-2.5deg);letter-spacing:.01em;text-wrap:balance}
.title-box p{margin:0;font-family:var(--tag);font-size:clamp(17px,3.4vw,24px);color:var(--ink);background:var(--pop);border:3px solid var(--ink);padding:.15em .7em;transform:rotate(1.2deg)}

.howto-link{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:8px;z-index:2;font-family:var(--body);font-weight:900;font-size:15px;color:var(--ink);background:var(--paper);border:2px solid var(--ink);padding:.25em .9em;text-decoration:none}
.howto-link:focus-visible{outline:3px solid var(--pop);outline-offset:2px}
.ver{position:absolute;left:max(10px,env(safe-area-inset-left,0px));top:6px;z-index:1;font-size:11px;color:#fff;text-shadow:0 1px 2px rgba(23,36,44,.7);font-variant-numeric:tabular-nums;pointer-events:none}

/* エンディング */
#v-ending{background:#0d1e26}
#ecv{position:absolute;inset:0;width:100%;height:100%;display:block}
#e-skip{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:10px;width:auto;padding:0 10px;font-size:13px;opacity:.85}
.e-foot{position:absolute;left:0;right:0;bottom:6%;display:flex;justify-content:center;pointer-events:none}
.e-foot .pop{pointer-events:auto}

/* メニュー */
#v-menu{background:var(--river)}
.topbar{display:flex;align-items:center;gap:10px;padding-block:9px;background:var(--ink);flex:none}
.topbar .logo{font-family:var(--display);color:var(--salmon);font-size:18px;white-space:nowrap;letter-spacing:.02em}
.purse{margin-left:auto;display:flex;align-items:center;gap:7px;font-family:var(--tag);font-size:19px;color:var(--pop);font-variant-numeric:tabular-nums;white-space:nowrap;background:#0d2a33;border:2px solid #2d5562;border-radius:99px;padding:3px 13px 3px 5px}
.purse b{font-weight:400}
.purse i{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#fff 0 9%,#ffb39a 11% 20%,#f0431f 32%,#b8200b 100%);border:2px solid #000;display:inline-block;flex:none}
.icon{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border:2px solid #2d5562;background:#0d2a33;border-radius:50%;color:var(--foam);flex:none}
.icon svg{width:20px;height:20px}
.icon[aria-pressed="false"]{color:#6f8f97}
.tabs{display:flex;background:var(--ink);gap:6px;flex:none;padding-top:2px}
.tabs button{position:relative;flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 4px 12px;font-weight:900;font-size:15px;color:#8fb0b6;background:#1d3039;border-radius:12px 12px 0 0;white-space:nowrap}
.tabs button svg{width:18px;height:18px;flex:none}
.tabs button[aria-selected="true"]{background:var(--river);color:var(--pop)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:22%;right:22%;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--pop)}
.scroll{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.pane{max-width:1000px;margin:0 auto;padding-block:16px 40px}
.pane[hidden]{display:none}
h2{font-family:var(--display);font-weight:400;font-size:21px;margin:0}

/* マップ */
.laps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.laps button{font-weight:700;font-size:14px;padding:6px 14px;border:2px solid #2f6d7c;background:#14505f;border-radius:99px;color:var(--foam)}
.laps button[aria-pressed="true"]{background:var(--pop);border-color:var(--ink);color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.laps button.sub{background:transparent;border-style:dashed;color:var(--mute)}
.laps button.sub::before{content:"▶";font-size:.75em;margin-right:6px;vertical-align:1px}
.laps button:not(.sub)+.sub{margin-left:auto}
.river{position:relative;display:flex;flex-direction:column;gap:12px;padding-left:46px}
/* 川の線と石は、どちらも中心が左から26pxにくるように合わせる */
.river::before{content:"";box-sizing:border-box;position:absolute;left:13px;top:4px;bottom:4px;width:26px;border-radius:10px;background:repeating-linear-gradient(180deg,#4cbdcf 0 14px,#2e9fb3 14px 28px);border:3px solid var(--ink);animation:flow 1.8s linear infinite}
@keyframes flow{to{background-position:0 28px}}
.ylock{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:28px 12px;border:3px dashed #3c5f69;border-radius:18px;background:#164b57}
.ylock h2{color:var(--pop)}
.ylock p{margin:0;color:var(--mute);font-size:15px;line-height:1.6}
.ynote{margin:0 0 16px;padding:9px 14px;background:var(--paper);color:var(--ink);border:2.5px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 #06181f;font-size:14px;line-height:1.5}
.ch-head{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.ch-head h2{font-size:19px}
.ch-head span{font-family:var(--tag);color:var(--mute);font-size:13px;background:#14505f;border-radius:99px;padding:2px 11px}
.st{position:relative;display:grid;grid-template-columns:62px minmax(0,1fr) auto;align-items:center;gap:12px;background:linear-gradient(180deg,#fffef8,#f4eedb);color:var(--ink);border:2.5px solid var(--ink);border-radius:14px;padding:10px 12px 10px 8px;box-shadow:0 4px 0 #06181f}
/* 川の上の石。済=白い石、つぎ=赤く光る石 */
.st::before{content:"";box-sizing:border-box;position:absolute;left:calc(26px - 15px - 46px - 2.5px);top:50%;width:30px;height:26px;margin-top:-13px;border-radius:52% 46% 50% 44%/56% 50% 48% 46%;background:#9aa9ae;border:3px solid var(--ink);box-shadow:inset -3px -3px 0 rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;font:900 13px/1 var(--body)}
.st.done::before{content:"✓";background:#fffdf4;color:#2a8ea3}
.st.next::before{background:var(--salmon);animation:beacon 1.2s ease-in-out infinite alternate}
@keyframes beacon{from{box-shadow:inset -3px -3px 0 rgba(0,0,0,.18),0 0 0 0 rgba(255,230,59,.6)}to{box-shadow:inset -3px -3px 0 rgba(0,0,0,.18),0 0 0 7px rgba(255,230,59,0)}}
.st.locked{background:#23424b;color:#86a6ac;box-shadow:none;border:2.5px dashed #3c5f69}
.st.locked::before{background:#30505a;border-color:#1e3a44}
.st.next{background:linear-gradient(180deg,#fff8c2,#ffe96a)}
.st.next::after{content:"つぎはここ!";position:absolute;left:14px;top:-12px;background:var(--roe);color:#fff;font:900 11px/1 var(--body);padding:4px 9px;border-radius:99px;border:2px solid var(--ink);transform:rotate(-3deg)}
.km{font-family:var(--tag);font-size:22px;line-height:1;text-align:right;color:var(--roe);font-variant-numeric:tabular-nums;padding-right:10px;border-right:2px dotted #d6c9a8}
.km small{font-size:12px;display:block;margin-top:2px}
.st.locked .km{color:inherit;border-right-color:#3c5f69}
.st.next .km{border-right-color:#d9b93a}
.st-main{min-width:0}
.st-name{font-weight:900;font-size:16.5px;line-height:1.25;overflow-wrap:anywhere}
.st-sub{font-size:12.5px;display:flex;gap:2px;flex-wrap:wrap;align-items:center;margin-top:4px;min-height:28px}
.st-sub canvas{width:28px;height:28px;display:block}
.st-sub em{font-style:normal;margin-left:6px;font-family:var(--tag);font-size:13px;background:rgba(214,201,168,.45);border-radius:99px;padding:1px 9px 1px 6px;display:inline-flex;align-items:center;gap:4px}
.st-sub em::before{content:"";width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#ffd3c2 0 18%,#f0431f 32%,#b8200b);border:1.5px solid #000}
.st.next .st-sub em{background:rgba(255,255,255,.55)}
/* 遡上ボタンは値札の形。左にひも穴 */
.go{position:relative;font-family:var(--body);font-weight:900;font-size:16px;padding:.45em .9em .45em 1.45em;border-radius:8px 12px 12px 8px;box-shadow:0 3px 0 var(--ink)}
.go::before{content:"";position:absolute;left:7px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--paper);border:2px solid var(--ink)}
.go:hover{box-shadow:0 4px 0 var(--ink)}
.go:active{box-shadow:0 1px 0 var(--ink)}
.stamp{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;border:2px solid var(--roe);color:var(--roe);background:rgba(227,23,10,.07);font-weight:900;font-size:11px;transform:rotate(-12deg);margin-left:6px;vertical-align:-3px}

/* いけす */
.team{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin:10px 0 20px;max-width:480px}
.tslot{aspect-ratio:1;background:#0b2a33;border:2px dashed #3c5f69;border-radius:12px;position:relative;display:block;overflow:hidden}
.tslot.on{background:radial-gradient(circle at 50% 40%,#fffef8,#efe6cf);border:2.5px solid var(--ink);box-shadow:0 3px 0 #06181f}
.tslot canvas{width:100%;height:100%;display:block}
.ike{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:9px}
.gh{margin:0 0 10px;font-size:15px;color:var(--pop)}
.gh:not(:first-child){margin-top:22px;padding-top:16px;border-top:2px dashed #2f6d7c}
.cell{position:relative;background:linear-gradient(180deg,#fffef8,#f1e9d3);color:var(--ink);border:2.5px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 #06181f;padding:3px 3px 5px;display:flex;flex-direction:column;align-items:center;min-width:0;overflow:hidden}
.cell canvas{width:100%;aspect-ratio:1;display:block}
.cell .nm{font-size:11px;font-weight:700;line-height:1.15;height:2.3em;overflow:hidden;text-align:center;display:flex;align-items:center}
.cell.sel{outline:3px solid var(--pop);outline-offset:2px}
.cell.r-R{background:linear-gradient(180deg,#fbfeff,#dcebf1)}
.cell.r-SR{background:linear-gradient(180deg,#fff4c9,#f5d36e)}
.cell.r-UR{background:linear-gradient(180deg,#3b3444,#1d1923);color:#ffe9a8;box-shadow:0 3px 0 #000,inset 0 0 0 2px #c9a43a}
.cell.lock{background:#23424b;color:#86a6ac;border:2.5px dashed #3c5f69;box-shadow:none}
.cell .lv{position:absolute;left:5px;top:5px;font-family:var(--tag);font-size:11px;line-height:16px;background:rgba(23,36,44,.86);color:var(--pop);border-radius:99px;padding:0 6px}
.cell.r-UR .lv{background:#c9a43a;color:#1d1923}
.cell .in{position:absolute;right:5px;top:5px;background:var(--roe);color:#fff;font-weight:900;font-size:10px;line-height:16px;padding:0 6px;border-radius:99px}
.detail{background:var(--paper);color:var(--ink);border:2.5px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 #06181f;padding:14px;position:sticky;top:12px;overflow:hidden}
.detail .head{display:flex;gap:10px;align-items:center;margin:-14px -14px 4px;padding:12px 14px;background:linear-gradient(180deg,#f7f0dc,#efe5c9);border-bottom:2px solid #e0d4b2}
.detail canvas{width:104px;height:104px;flex:none}
.detail h3{margin:0;font-family:var(--display);font-weight:400;font-size:20px;line-height:1.2;overflow-wrap:anywhere}
.detail .rar{font-family:var(--tag);font-size:14px;color:var(--roe)}
.detail p{margin:8px 0;font-size:14px;line-height:1.6}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin:8px 0;font-size:13px}
.stats div{display:flex;justify-content:space-between;gap:4px;background:#f2ead4;border-radius:8px;padding:3px 8px;font-variant-numeric:tabular-nums}
.stats b{font-weight:900}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.chips span{background:var(--ink);color:var(--pop);font-size:12px;padding:2px 9px;font-weight:700;border-radius:99px}
.detail .act{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.detail .act .pop{font-family:var(--body);font-weight:900;font-size:15px;box-shadow:0 3px 0 var(--ink);flex:1 1 auto}
.metas{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:10px}
.meta{background:#0f2e37;border:2px solid #2d5562;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.meta b{font-weight:900;font-size:16px}
.meta small{color:var(--mute);font-size:13px}
.meta .pop{font-family:var(--body);font-weight:900;font-size:14px;box-shadow:0 3px 0 #000;align-self:flex-start}
h2.mt{margin-top:28px}
.fuse-hint{margin:4px 0 0;font-size:13px;color:var(--mute)}
.fuses{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:9px;margin-top:10px}
.fuse{display:flex;gap:10px;align-items:center;min-width:0;background:linear-gradient(180deg,#fffef8,#f1e9d3);color:var(--ink);border:2.5px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 #06181f;padding:8px}
.fuse canvas{width:64px;height:64px;flex:none}
.fuse>div{min-width:0;display:flex;flex-direction:column;gap:2px}
.fuse b{font-weight:900;font-size:15px}
.fuse small{font-size:12px;line-height:1.45;color:#4f5f64}
.fuse.lock{background:#23424b;color:#86a6ac;border:2.5px dashed #3c5f69;box-shadow:none}
.fuse.lock small{color:#86a6ac}
.fuse .q{width:64px;height:64px;flex:none;display:flex;align-items:center;justify-content:center;background:#1a3740;border-radius:10px;font-family:var(--display);font-size:30px;color:#6f8f97}

/* 回転レーン。上下に銀のレール、皿にはサーモンのにぎり */
.lanebox{background:#2e2a34;border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 #06181f;overflow:hidden;position:relative;height:108px;margin:12px 0}
.lanebox::before,.lanebox::after{content:"";position:absolute;left:0;right:0;height:11px;background:linear-gradient(180deg,#eef3f5,#9aa7ae);z-index:1}
.lanebox::before{top:0;border-bottom:2px solid var(--ink)}
.lanebox::after{bottom:0;border-top:2px solid var(--ink)}
.belt{position:absolute;left:0;top:11px;bottom:11px;width:calc(100% + 150px);display:flex;gap:40px;padding-top:8px;background:repeating-linear-gradient(90deg,#4d4756 0 36px,#3a3542 36px 38px);animation:belt 3.6s linear infinite}
.belt.fast{animation-duration:.5s}
@keyframes belt{to{transform:translateX(-150px)}}
.plate{flex:none;width:110px;height:64px;position:relative}
.plate::before{content:"";position:absolute;left:0;right:0;bottom:6px;height:24px;border-radius:50%;background:radial-gradient(ellipse at 50% 45%,#fff 0 46%,#e4dfd3 48% 56%,#fff 58%);border:2.5px solid var(--ink);box-shadow:0 5px 0 var(--ink)}
.plate.g::before{background:radial-gradient(ellipse at 50% 45%,#ffe58a 0 46%,#d39b18 48% 56%,#f6c93a 58%)}
.plate.k::before{background:radial-gradient(ellipse at 50% 45%,#3d3646 0 46%,#c9a43a 48% 52%,#1f1b25 54%)}
.plate i{position:absolute;left:33px;right:33px;bottom:17px;height:15px;border-radius:45% 45% 35% 35%;background:#fffdf4;border:2.5px solid var(--ink)}
.plate::after{content:"";position:absolute;left:27px;right:27px;bottom:26px;height:17px;border-radius:55% 55% 40% 40%/85% 85% 30% 30%;background:repeating-linear-gradient(110deg,#ff8a5c 0 7px,#ffcdb5 7px 9px);border:2.5px solid var(--ink)}
.gacha{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
.rates{font-size:14px;line-height:1.9}
.rates b{font-family:var(--tag);font-weight:400;color:var(--pop);margin-left:6px}
.reveal{background:var(--paper);color:var(--ink);border:2.5px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 #06181f;padding:14px;text-align:center;min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.reveal canvas{width:150px;height:150px}
.reveal.r-SR{background:linear-gradient(180deg,#fff4c9,#f5d36e)}.reveal.r-UR{background:linear-gradient(180deg,#3b3444,#1d1923);color:#ffe9a8}
.reveal h3{margin:0;font-family:var(--display);font-weight:400;font-size:21px}
.reveal .tagline{font-family:var(--tag);color:var(--roe);font-size:16px}
.reveal.r-UR .tagline{color:var(--pop)}
.reveal .plate.q{transform:scale(1.25);margin-bottom:6px}
.reveal .plate.q::after{content:"?";background:none;border:0;left:0;right:0;bottom:24px;height:auto;text-align:center;font:30px/1 var(--display);color:#c9bfa6}
.reveal .plate.q i{display:none}
.reveal p{margin:0;color:#5b6b70;font-size:14px}
.reveal.pulse{animation:pop .35s}
@keyframes pop{0%{transform:scale(.7)}70%{transform:scale(1.05)}100%{transform:scale(1)}}

/* バトル */
#v-battle{background:#000}
.field{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;cursor:grab}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding-top:8px;pointer-events:none}
.hud>*{pointer-events:auto}
#hud-stage{font-family:var(--tag);font-size:15px;color:var(--foam);background:rgba(13,52,64,.86);border:2px solid rgba(233,247,244,.28);border-radius:99px;padding:3px 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

.side{display:flex;flex-direction:column;gap:4px;min-width:0}

.panel{flex:none;background:linear-gradient(180deg,#1f3541,#17242c 40%);border-top:3px solid #0b1a20;box-shadow:inset 0 2px 0 rgba(255,255,255,.06);display:grid;grid-template-columns:96px minmax(0,1fr) 96px;gap:8px;padding-block:9px 11px}

.slot{position:relative;height:66px;background:linear-gradient(180deg,#fffef8,#efe6cf);border:2.5px solid #000;border-radius:10px;box-shadow:0 3px 0 #000;overflow:hidden;min-width:0;display:block}

.slot.poor canvas{filter:grayscale(1) brightness(.75)}
.slot.poor .price{background:#c7d3d3;color:#5b6b70}
.slot.empty{background:#1b2e37;border:2px dashed #2d4650;box-shadow:none;cursor:default}
.big{position:relative;border:2.5px solid #000;border-radius:12px;box-shadow:0 3px 0 #000;background:linear-gradient(180deg,#fffef8,#efe6cf);color:var(--ink);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;min-width:0;text-align:center}
.big:active,#btn-god:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.big b{font-weight:900;font-size:16px;line-height:1.15;position:relative}

.big.ready{background:var(--pop);animation:ready .7s infinite alternate}
.big.ready .fill{display:none}
.big.off{opacity:.6}
.big b,.big small{white-space:nowrap}
@keyframes ready{to{background:#fff27a}}
.over{position:absolute;inset:0;background:rgba(6,24,31,.72);display:flex;align-items:center;justify-content:center;z-index:5;padding-block:16px}
.over[hidden]{display:none}
.card{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 #000;max-width:440px;width:100%;padding:22px 20px;display:flex;flex-direction:column;gap:12px;text-align:center;max-height:100%;overflow:auto}

.card .prize::before{content:"";width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#fff 0 9%,#ffb39a 11% 20%,#f0431f 32%,#b8200b);border:2px solid #000}

.card.scene h2{font-size:clamp(23px,6vw,32px)}
.card.scene p{font-size:14px;line-height:1.6}
#tip{position:absolute;left:50%;top:64px;transform:translateX(-50%);background:var(--paper);color:var(--ink);border:2.5px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);padding:8px 12px;font-size:14px;line-height:1.5;width:min(420px,calc(100% - 32px));text-align:left;cursor:pointer}
#toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--pop);font-family:var(--tag);padding:6px 16px;border:2px solid var(--pop);border-radius:99px;z-index:9;white-space:nowrap}

.budget{position:sticky;top:0;z-index:2;background:var(--paper);color:var(--ink);border:2.5px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 #06181f;padding:8px 14px 10px;margin-bottom:12px}

function battleCfg(save){

}

function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

class Battle{
  constructor(si,lap,cfg,seed){
    const s=stagesOf(lap)[si];this.s=s;this.si=si;this.lap=lap;this.cfg=cfg;this.L=s.len;this.time=0;this.over=null;
    this.mul=LAPS[lap].m;this.rand=mulberry(seed??(Math.random()*1e9|0));
    this.pbase={isBase:1,side:1,x:this.L-74,w:96,hp:cfg.baseHp,max:cfg.baseHp,shake:0};
    const eb=Math.round(s.base*this.mul);
    this.ebase={isBase:1,side:-1,x:74,w:96,hp:eb,max:eb,shake:0};
    this.money=0;this.stom=1;this.us=[];this.es=[];this.fx=[];this.queue=[];this.wave=null;
    this.slots=cfg.slots.map(x=>({id:x.id,lv:x.lv,def:UNITS[x.id],cd:0,pool:x.pool?[...x.pool]:null}));
    // 真の遡上。仲間の数がかぎられていて、やられた仲間は戻らない
    this.trial=!!cfg.trial;this.fallen=[];
    this.flood={c:0,need:cfg.floodNeed,dmg:cfg.floodDmg};
    this.rules=s.rules.map(r=>({...r,on:false,cnt:0,next:0}));
    this.kills=0;this.lastHit=null;this.god={cd:0,act:0};
    this.hard=!!LAPS[lap].hard;this.bgod=null;this.clash=null;this.seal=0;
    this.fast=!!LAPS[lap].fast;this.gimT=GIM_EVERY[s.gim]||0;
    // 絶食ルール:胃袋は最大まで広げた状態で満腹から始まる。たまる速さは胃袋Lv1の半分のまま
    if(this.fast){this.stom=STOM.max;this.money=this.cap}
  }
  get income(){return this.fast?STOM.income(1)*this.cfg.income*.5:STOM.income(this.stom)*this.cfg.income}
  get cap(){return STOM.cap(this.stom)}
  canDeploy(i){const s=this.slots[i];return s&&!this.over&&!this.clash&&s.cd<=0&&this.money>=s.def.cost&&this.us.length<40&&!(s.pool&&!s.pool.length)}
  deploy(i){
    if(!this.canDeploy(i))return false;
    const s=this.slots[i];this.money-=s.def.cost;s.cd=s.def.cd;
    const n=s.def.count||1;s.last=[];s.at=this.time;
    // 名札。同じ組で出た仲間(イクラ三兄弟)は同じ名札を持ち、全員やられた時に力尽きる
    const crew=s.pool?[{s:i,nm:s.pool.shift()}]:null;
    for(let k=0;k<n;k++){const u=this.addUnit(s.id,s.lv,this.pbase.x-44-k*16);if(crew){u.crew=crew;u.acc=accOf(s.id,crew[0].nm)}s.last.push(u)}
    this.fx.push({k:'spawn',x:this.pbase.x-44,side:1});
    return true;
  }
  // 2つの値札の仲間が合体できるなら、その合体の名前を返す
  fuseOf(a,b){const x=this.slots[a]?.id,y=this.slots[b]?.id;if(!x||!y||x===y)return null;for(const[k,f]of Object.entries(FUSE))if(f.of.includes(x)&&f.of.includes(y))return k;return null}
  // 値札aを押した直後に値札bが押された時。aで出たばかりの仲間を引っこめて、合体した1体を出す
  fuse(a,b,fid){
    const sa=this.slots[a],sb=this.slots[b];
    if(!this.canDeploy(b)||!sa.last||this.time-sa.at>.5||!sa.last.every(u=>u.alive))return false;
    this.money-=sb.def.cost;sb.cd=sb.def.cd;
    const ca=sa.last[0].crew;
    for(const u of sa.last)u.alive=false;this.us=this.us.filter(u=>u.alive);sa.last=null;
    const x=this.pbase.x-44,f=this.addUnit(fid,Math.round((sa.lv+sb.lv)/2),x);this.fx.push({k:'fuse',x,id:fid});
    // 合体した1体は、2匹ぶんの名札を持つ
    if(sb.pool)f.crew=[...(ca||[]),{s:b,nm:sb.pool.shift()}];
    return true;
  }
  addUnit(id,lv,x){
    const d=UNITS[id]||FUSE[id],m=lvMul(lv);
    const e=this.make(d,1,x,d.hp*m,d.atk*m);e.shield=!!d.shield;e.revive=!!d.revive;e.lv=lv;e.id=id;
    this.us.push(e);return e;
  }
  addEnemy(id){
    const d=ENEMIES[id],m=this.mul;
    const e=this.make(d,-1,this.ebase.x+50,d.hp*m,d.atk*m);e.id=id;
    if(this.hard&&BGOD[id])e.bg=BGOD[id].uses;
    this.es.push(e);
    if(d.boss){this.fx.push({k:'boss',name:d.n});for(const u of this.us)this.knock(u);this.fx.push({k:'shock'});}
  }
  make(d,side,x,hp,atk){
    return{def:d,side,dir:-side,x,lane:this.rand()*16|0,hp,maxhp:hp,atk,range:d.range,w:d.w,state:'move',timer:0,kbDone:0,
      walk:this.rand()*6,hurt:0,slow:0,stun:0,anim:0,lunge:0,alive:true,seed:this.rand()};
  }
  canUp(){return this.stom<STOM.max&&this.money>=STOM.cost(this.stom)&&!this.over}
  upStom(){if(!this.canUp())return false;this.money-=STOM.cost(this.stom);this.stom++;return true}
  // 鮭の守護神。広告のあとに呼ぶ。kindは0並 1上 2特上。姿が見えてから少しして効く
  canGod(){return this.god.cd<=0&&!this.over&&!(this.seal>0)&&!this.clash}
  summon(kind){
    if(!this.canGod())return false;
    this.god.cd=GOD_CD;
    // ボスの守護神が出ている最中なら、守護神どうしの押し合いになる
    if(this.bgod){this.clash={b:this.bgod,pk:kind,first:'b'};this.fx.push({k:'clash'});return true}
    this.startGod(kind);return true;
  }
  startGod(kind){
    this.god.act=GOD_ACT[kind];this.fx.push({k:'god',kind,t:this.time});
    const later=(t,fn)=>this.queue.push({t,fn,tag:'p'});
    const hitAll=(r,fn)=>{for(const e of this.es){if(!e.alive)continue;const boss=!!e.def.boss;this.fx.push({k:'hit',x:e.x,y:GROUND-40-(e.def.fly||0),big:1});this.damage(e,e.maxhp*r[boss?1:0]);if(e.alive&&fn)fn(e,boss)}};
    // 並:3連の波。1回ごとに押し返す
    if(kind===0)for(let i=0;i<3;i++)later(GOD_HITS[0][i],()=>{this.fx.push({k:'godhit',kind});hitAll([.4/3,.04],e=>this.knock(e))});
    // 上:流星が3回に分けて当たる。最初の1回で時が止まる
    if(kind===1){later(GOD_HITS[1][0],()=>{this.money=this.cap});for(let i=0;i<3;i++)later(GOD_HITS[1][i],()=>{this.fx.push({k:'godhit',kind});hitAll([.1,.035],(e,boss)=>{if(i===0)e.stun=boss?2.5:5})})}
    // 特上:鮭が川から空へのぼる列が、手前から敵の方へ3回走る。当たった敵は消える(ボスは削る)
    if(kind===2){
      later(GOD_HITS[2][0],()=>{this.fx.push({k:'godhit',kind});for(const u of this.us)u.hp=u.maxhp});
      const from=this.pbase.x,span=from-this.ebase.x;
      for(let i=0;i<3;i++)later(GOD_HITS[2][i],()=>{
        this.fx.push({k:'sweep'});
        // 列が来たら敵の真下から鮭がのぼり、その鮭が体に届いた時に当たる
        for(const e of this.es)later(Math.max(0,(from-e.x)/span)*GOD_SWEEP,()=>{
          if(!e.alive)return;this.fx.push({k:'riser',x:e.x});
          later((60+(e.def.fly||0))/GOD_RISE,()=>{if(e.alive)this.damage(e,e.maxhp*(e.def.boss?.12:1))});
        });
        later(GOD_SWEEP,()=>{this.ebase.hp-=this.ebase.max*.05;this.ebase.shake=.3});
      });
    }
  }
  // ハードのボスが追い詰められた時。こちらの守護神が効いている最中なら押し合いになる
  bossGod(e){
    e.bg--;e.pend=false;
    const g={who:e,id:e.id,act:BGOD[e.id].life};
    if(this.god.act>0){this.clash={b:g,pk:-1,first:'p'};this.fx.push({k:'clash'});return}
    this.startBGod(g);
  }
  startBGod(g){
    const e=g.who,kb=e.def.kb;this.bgod=g;
    if(e.alive){e.hp=Math.max(e.hp,e.maxhp*.5);e.kbDone=Math.min(kb-1,Math.floor(.5*kb));this.fx.push({k:'word',x:e.x,s:'回復',col:'#8dff9c'})}
    this.fx.push({k:'bgod',id:g.id,x:e.x,name:e.def.n,god:BGOD[g.id].n,t:this.time});
    const later=(t,fn)=>this.queue.push({t,fn,tag:'b'});
    const allies=()=>this.us.filter(u=>u.alive&&u.state!=='air');
    // 前にいる仲間ほど敵に近い(xが小さい)。先頭からn体
    const front=n=>allies().sort((a,b)=>a.x-b.x).slice(0,n);
    const hurt=(u,r)=>{this.fx.push({k:'hit',x:u.x,y:GROUND-34,big:1});u.by=g.id;this.damage(u,u.maxhp*r)};
    const bx=e.x;
    switch(g.id){
      // 大トドが腹ばいで落ち、流氷が手前へすべる。当たった仲間は凍って止まる
      case'todo':later(1.3,()=>{this.fx.push({k:'bghit',id:g.id});
        for(const u of allies())later(Math.max(0,u.x-bx)/FLOE_V,()=>{if(!u.alive)return;hurt(u,.25);if(u.alive){u.stun=4;u.ice=1}})});break;
      // 大きな網で前の仲間をすくい、群れのところまで放り投げる。落ちた時にダメージ
      case'amimoto':later(1.9,()=>{this.fx.push({k:'bghit',id:g.id});
        for(const u of front(8)){u.state='air';u.by=g.id;u.air={t:0,d:1.1,x0:u.x,x1:this.pbase.x-44}}});break;
      // すし皿がつぎつぎ飛んできて、前の仲間に当たる
      case'taisho':for(let i=0;i<4;i++)later(1.3+i*.4,()=>{this.fx.push({k:'bghit',id:g.id});for(const u of front(6))hurt(u,.18)});break;

      case'nushi':for(let i=0;i<3;i++)later(1.3+i*.7,()=>{this.fx.push({k:'bghit',id:g.id});for(const u of allies()){hurt(u,.12);if(u.alive)this.knock(u)}});break;

      case'kibori':later(1.2,()=>{this.seal=SEAL});
        for(let i=0;i<3;i++)later(1.4+i*.7,()=>{this.fx.push({k:'bghit',id:g.id});for(const u of allies())hurt(u,.12);this.pbase.hp-=this.pbase.max*.04;this.pbase.shake=.3});break;
    }
  }
  // 押し合いの決着。勝てばボスの守護神を打ち消し、負ければこちらの守護神が消える
  resolveClash(win){
    const c=this.clash;if(!c)return;this.clash=null;
    if(win){
      if(c.first==='b'){this.queue=this.queue.filter(q=>q.tag!=='b');this.bgod=null;this.startGod(c.pk)}
    }else if(c.first==='p'){this.queue=this.queue.filter(q=>q.tag!=='p');this.god.act=0;this.startBGod(c.b)}
    this.fx.push({k:'clashEnd',win,first:c.first});
  }
  canFire(){return this.flood.c>=this.flood.need&&!this.over&&!this.wave&&!(this.seal>0)&&!this.clash}
  fire(){if(!this.canFire())return false;this.flood.c=0;this.wave={x:this.pbase.x,hit:new Set()};this.fx.push({k:'wave'});return true}

  nearest(e){
    const d=e.dir,foes=e.side>0?this.es:this.us;let best=null,bd=1e9;
    for(const t of foes){
      if(!t.alive||t.state==='kb'||t.state==='air')continue;
      const dx=(t.x-e.x)*d;if(dx<-24)continue;
      const g=Math.max(0,dx-t.w/2);
      if(g<=e.range&&g<bd){bd=g;best=t}
    }
    const b=e.side>0?this.ebase:this.pbase,gap=(b.x-e.x)*d-b.w/2;
    if(gap<=e.range&&gap<bd)best=b;
    return best;
  }
  step(dt){
    if(this.over||this.clash)return;
    this.time+=dt;
    this.money=Math.min(this.cap,this.money+this.income*dt);
    for(const s of this.slots)s.cd=Math.max(0,s.cd-dt);
    this.flood.c=Math.min(this.flood.need,this.flood.c+dt);
    this.god.cd=Math.max(0,this.god.cd-dt);this.god.act=Math.max(0,this.god.act-dt);this.seal=Math.max(0,this.seal-dt);
    if(this.bgod&&(this.bgod.act-=dt)<=0)this.bgod=null;
    // 守護神を待っているボス(別のボスの守護神が出ていた)がいれば、空いた時によぶ
    if(!this.bgod&&!this.clash){const w=this.es.find(e=>e.alive&&e.pend);if(w){this.bossGod(w);if(this.clash)return}}
    this.pbase.shake=Math.max(0,this.pbase.shake-dt);this.ebase.shake=Math.max(0,this.ebase.shake-dt);
    if(this.gimT&&(this.gimT-=dt)<=0){this.gimT=GIM_EVERY[this.s.gim];this.gimmick()}
    const pct=this.ebase.hp/this.ebase.max*100;
    for(const r of this.rules){
      if(r.done)continue;
      if(!r.on){if(this.time>=r.t&&pct<=(r.hp??100)){r.on=true;r.next=0}else continue}
      r.next-=dt;
      if(r.next<=0){

        r.cnt++;r.next=r.ev;
        if(r.n&&r.cnt>=r.n)r.done=true;
      }
    }
    for(let i=this.queue.length-1;i>=0;i--){const q=this.queue[i];q.t-=dt;if(q.t<=0){this.queue.splice(i,1);q.fn()}}

    for(const e of this.es)this.act(e,dt);

      const w=this.wave;w.x-=900*dt;

        w.hit.add(e);this.fx.push({k:'hit',x:e.x,y:GROUND-40,big:1});
        this.damage(e,this.flood.dmg*(1+this.mul*.4));if(e.alive)this.knock(e);
      }

    }

  gimmick(){

      this.fx.push({k:'gim',s:'外輪船の波!'});for(const u of allies){this.damage(u,u.maxhp*.06);if(u.alive)this.knock(u,1)}

      this.fx.push({k:'gim',s:'急流!'});for(const u of allies)this.knock(u,1);for(const e of this.es)if(e.alive&&!e.def.boss)this.knock(e,1);
    }
  }
  act(e,dt){
    if(!e.alive)return;

    }
  }
  attack(e){
    const d=e.def;

    }
    const t=this.nearest(e);

    if(d.haste)for(const a of this.us)if(a.alive&&Math.abs(a.x-e.x)<=140){if(!(a.haste>0))this.fx.push({k:'haste',x:a.x});a.haste=4}
    this.fx.push({k:'atk',fx:d.fx,x:e.x,tx:t.x,side:e.side,lane:e.lane,fly:d.fly||0});
    const delay=Math.abs(t.x-e.x)>70?.2:0;

  }
  strike(e,t){
    const d=e.def,foes=e.side>0?this.es:this.us;

    }else if(t.isBase||t.alive)this.hit(e,t);
  }
  hit(a,t){
    const d=a.def;let dmg=a.atk;

      if(a.side<0&&this.over)return;
      t.hp-=dmg;t.shake=.2;if(a.side<0)this.lastHit=a.id;this.fx.push({k:'hit',x:t.x+a.dir*-30,y:GROUND-60});return;

    if(d.vs&&d.vs[t.def.trait])dmg*=d.vs[t.def.trait];

    this.fx.push({k:crit?'crit':'hit',x:t.x,y:GROUND-30-(t.def.fly||0),big:dmg>400});
    if(a.side<0)t.by=a.id;
    this.damage(t,dmg);
    if(!t.alive)return;

    if(d.stun&&!t.def.boss&&this.rand()<d.stun.p)t.stun=d.stun.t;

  }

    if(!t.alive)return;

    if(t.bg>0&&t.hp<t.maxhp*.3){t.hp=Math.max(t.hp,1);if(!t.pend){t.pend=true;if(!this.bgod&&!this.clash)this.bossGod(t)}}

      if(t.revive){t.revive=false;t.hp=t.maxhp*.5;t.kbDone=0;this.fx.push({k:'revive',x:t.x});this.knock(t);return}
      if(t.shield){t.shield=false;t.hp=1;this.fx.push({k:'guard',x:t.x});}

  }
  knock(t,quiet){if(!t.alive)return;t.state='kb';t.timer=KB_T;if(!quiet)this.fx.push({k:'kb',x:t.x,y:GROUND-40})}
  kill(t){
    t.alive=false;this.fx.push({k:'die',e:t});
    // 名札の仲間が全員やられたら、その仲間は力尽きる
    if(t.crew)for(const c of t.crew)if(!this.us.some(u=>u.alive&&u.crew&&u.crew.includes(c))){const s=this.slots[c.s];this.fallen.push(c);this.lastFall=t.by;this.fx.push({k:'fallen',s:c.s,id:s.id,nm:c.nm,by:t.by})}

  }
}
return{TRIAL,nameOf,accOf,YUKON,stagesOf,VH,WATER_Y,GROUND,GOD_HITS,GOD_SWEEP,BGOD,FLOE_V,CLASH_T,CLASH_RATE,TRAIT,LAPS,RARE,UNITS,FUSE,ENEMIES,CHAPTERS,STAGES,STOM,META,lvMul,lvCost,metaCost,battleCfg,Battle};
})();

/* いけす */
function abilityChips(d){
  const a=[];
  if(d.count)a.push(`${d.count}体で出撃`);
  if(d.area)a.push('範囲攻撃');
  if(d.range>=90&&!d.heal)a.push('遠くまで届く');
  if(d.vs)for(const[k,v]of Object.entries(d.vs))a.push(`${TRAIT[k]}に${v}倍`);
  if(d.crit)a.push(`トロの一撃 ${d.crit*100}%`);
  if(d.slow)a.push('敵を遅くする');
  if(d.stun)a.push(`敵を止める ${d.stun.p*100}%`);
  if(d.kbc)a.push(`吹き飛ばす ${d.kbc*100}%`);
  if(d.heal)a.push(`仲間を回復 ${d.heal*100}%`);
  if(d.roll)a.push('止まらず転がる');
  if(d.shield)a.push('一度だけ耐える');
  if(d.onDeath)a.push(`倒れると${UNITS[d.onDeath.id].n}${d.onDeath.n}体`);
  if(d.haste)a.push('仲間の足を速くする');
  if(d.revive)a.push('一度だけ起き上がる');
  if(d.fat)a.push(`倒れるとオキアミ +${d.fat}`);
  return a;
}

}
let slotCache=[];
function syncHud(){
  const full=B.money>=B.cap,hm=$('hud-money');
  $('m-now').textContent=fmt(B.money);$('m-cap').textContent=` / ${fmt(B.cap)}`;
  hm.style.setProperty('--c',B.money/B.cap);hm.classList.toggle('full',full);
  B.slots.forEach((s,i)=>{const el=$('slot-'+i);if(!el)return;
    const poor=B.money<s.def.cost,waiting=s.cd>0,done=(1-s.cd/s.def.cd).toFixed(2),left=s.pool?s.pool.length:-1,key=`${poor}${waiting}${done}${left}`;
    if(slotCache[i]===key)return;slotCache[i]=key;
    if(s.pool){el._left.textContent=left?'×'+left:'なし';el.classList.toggle('gone',!left)}
    if(!waiting&&el.classList.contains('cooling'))el.classList.add('flash');
    el.classList.toggle('poor',poor);el.classList.toggle('cooling',waiting);
    el._bar.style.setProperty('--c',done);el._sec.textContent=Math.ceil(s.cd)});
  const st=$('btn-stom'),fl=$('btn-flood'),mx=B.stom>=STOM.max;
  st.querySelector('b').textContent=`胃袋 Lv${B.stom}`;st.querySelector('small').textContent=B.fast?'食べない':mx?'最大':`${STOM.cost(B.stom)}で+${STOM.cap(B.stom+1)-STOM.cap(B.stom)}`;
  st.style.setProperty('--c',mx?1:Math.min(1,B.money/STOM.cost(B.stom)));st.classList.toggle('ready',B.canUp());
  const gb=$('btn-god'),gc=B.god.cd,gs=B.seal>0?'封印中':gc>0?`あと${Math.floor(Math.ceil(gc)/60)}:${String(Math.ceil(gc)%60).padStart(2,'0')}`:'CMのあとで';
  if(gb._s!==gs){gb._s=gs;gb.querySelector('small').textContent=gs}gb.classList.toggle('ready',B.canGod()&&!paused);gb.disabled=gc>0||B.seal>0||!!B.over;
  const ready=B.canFire();fl.classList.toggle('ready',ready);fl.style.setProperty('--c',B.flood.c/B.flood.need);fl.querySelector('small').textContent=B.seal>0?`封印中 ${Math.ceil(B.seal)}秒`:ready?'押すと発射':`${Math.ceil(B.flood.need-B.flood.c)}秒`;
}
function tickBattle(dt){
  if(!B)return;
  if(!paused&&!B.over){
    const st=1/60;acc+=Math.min(.1,dt)*speed;
    while(acc>=st){B.step(st);acc-=st}
    if(userPan>0)userPan-=dt;
    else{const front=B.us.length?Math.min(...B.us.map(e=>e.x)):B.L,fb=vfx.find(v=>v.k==='bgod'),target=fb?bgFocus(fb):front-vw*.32;cam+=(target-cam)*Math.min(1,dt*1.6);clampCam()}
  }
  drainFx();tickGodSfx();if(!paused)tickObit(dt);
  // 演出もゲームの速さに合わせる。×2で当たる時刻と絵がずれないように
  for(const f of vfx)f.t+=paused||B.clash?0:dt*speed;
  vfx=vfx.filter(f=>f.t<f.life);
  if(!paused){shakeT=Math.max(0,shakeT-dt);flash=Math.max(0,flash-dt);if(banner)banner.t+=dt}
  drawField(dt);if(clashT>=0)tickClash(dt);syncHud();
  if(adT<0)Snd.setBgm(!B.over&&B.es.some(e=>e.def.boss)?'boss':'normal');
  if(scene)scene();
  // 遡上成功:拠点がくずれる様子を見せてから結果を出す
  if(B.over==='win'){if(!B.ebase.broken){B.ebase.broken=1;startCollapse()}
    cam+=(B.ebase.x-vw*.42-cam)*Math.min(1,dt*5);clampCam()}
  if(B.over&&!endQueued){endQueued=true;setTimeout(finish,B.over==='win'?900+(1500+B.crWait*1000)/speed:900)}
}
let acc=0,scene=null;
// 敵の拠点を絵ごと小さな四角に切り分けて、がれきにする。どのステージの拠点でも同じしくみで壊れる
function startCollapse(){
  const S=2,W=360,H=300,ox=180,oy=272,cols=7,rows=6,cw=W/cols,chh=H/rows;
  const cv=document.createElement('canvas');cv.width=W*S;cv.height=H*S;const x=cv.getContext('2d');
  x.scale(S,S);x.translate(ox,oy);A.drawEnemyBase(x,B.s.ch,clock,0);
  const d=x.getImageData(0,0,cv.width,cv.height).data,parts=[];
  for(let i=0;i<cols;i++)for(let j=0;j<rows;j++){
    let on=0;for(let yy=0;yy<chh*S&&on<6;yy+=3)for(let xx=0;xx<cw*S;xx+=3){const k=(((j*chh*S+yy)|0)*cv.width+((i*cw*S+xx)|0))*4+3;if(d[k]>60&&++on>=6)break}
    if(on<6)continue;
    const cx=i*cw+cw/2-ox,cy=j*chh+chh/2-oy;
    parts.push({sx:i*cw,sy:j*chh,cx,cy,vx:cx*2.4-50+(Math.random()-.5)*140,vy:-220-Math.random()*300+cy*.8,vr:(Math.random()-.5)*9})}
  const dust=[];for(let i=0;i<10;i++)dust.push({x:(Math.random()-.5)*170,y:-Math.random()*50,r:18+Math.random()*16,vx:(Math.random()-.5)*90,d:Math.random()*.25});
  // カメラが拠点に着くまで待ってから崩す(遠いステージでは少し待つ)
  const far=Math.abs(cam-Math.max(0,Math.min(B.L-vw,B.ebase.x-vw*.42)));B.crWait=far>vw*.3?.6:far>40?.25:0;
  vfx.push({k:'crumble',t:-B.crWait,life:2.6,img:cv,S,cw,chh,parts,dust,x:B.ebase.x,g:GROUND+6});
}
function drawCrumble(c,f){
  const t=f.t,go=Math.max(0,t-.3),a=Math.max(0,Math.min(1,(f.life-t)/.6));
  c.save();c.translate(f.x,f.g);
  if(t<0){c.drawImage(f.img,-180,-272,360,300);c.restore();return}
  if(!f.snd){f.snd=1;shakeT=REDUCED?0:.8;flash=Math.max(flash,.35);Snd.crash()}
  // くずれる前に、ひびが入ってぶるぶる震える
  if(t<.3){const j=REDUCED?0:(Math.random()-.5)*6;c.save();c.translate(j,0);c.drawImage(f.img,-180,-272,360,300);
    c.strokeStyle='#17242c';c.lineWidth=2.4;c.lineCap='round';const k=t/.3;
    for(const[x0,y0,x1,y1]of[[-10,-120,-30,-60],[-30,-60,-12,-10],[20,-100,40,-40],[-30,-60,-62,-48],[40,-40,64,-20]]){c.beginPath();c.moveTo(x0,y0);c.lineTo(x0+(x1-x0)*k,y0+(y1-y0)*k);c.stroke()}
    c.restore()}
  else{
    // がれき
    c.globalAlpha=a;
    for(const p of f.parts){const x=p.cx+p.vx*go,y=p.cy+p.vy*go+700*go*go;
      c.save();c.translate(x,y);c.rotate(p.vr*go);c.drawImage(f.img,p.sx*f.S,p.sy*f.S,f.cw*f.S,f.chh*f.S,-f.cw/2,-f.chh/2,f.cw,f.chh);c.restore()}
    // 土けむり
    for(const u of f.dust){const k=Math.max(0,go-u.d);if(k<=0)continue;const r=u.r*(1+k*2.2);c.globalAlpha=Math.max(0,.75-k*.55)*a;
      c.fillStyle='#e9e2d0';c.beginPath();c.arc(u.x+u.vx*k,u.y-k*30,r,0,6.3);c.fill()}
  }
  c.restore();c.globalAlpha=1;
  // 道がひらいた合図
  if(t>.45&&t<2.2){c.save();c.globalAlpha=Math.min(1,(t-.45)/.2,(2.2-t)/.3);c.font="34px 'Dela Gothic One',sans-serif";c.textAlign='center';c.lineJoin='round';
    const y=f.g-165-Math.min(1,(t-.45)/.25)*14;const tx=Math.max(f.x,cam+110);c.lineWidth=7;c.strokeStyle='#17242c';c.strokeText('ドカーン!',tx,y);c.fillStyle='#ffe63b';c.fillText('ドカーン!',tx,y);c.restore()}
}

const par=$('parade'),pctx=par.getContext('2d');
const paradeIds=['shake','ikura','nigiri','beni','aramaki','onigiri','sakura','ashi','oyako','smoke','king','keiji','toba','gin','ishikari','hanamagari','flake','toki','karafuto','abari','chanchan','trout','osuke'];
function drawParade(){
  const r=par.getBoundingClientRect();if(!r.width)return;const d=Math.min(devicePixelRatio||1,2);
  if(par.width!==(r.width*d|0)||par.height!==(r.height*d|0)){par.width=r.width*d|0;par.height=r.height*d|0}
  const c=pctx;c.setTransform(d,0,0,d,0,0);
  const g=c.createLinearGradient(0,0,0,r.height);g.addColorStop(0,'#ffb994');g.addColorStop(.55,'#f7dcc0');c.fillStyle=g;c.fillRect(0,0,r.width,r.height);
  c.fillStyle='#6f9a62';c.beginPath();c.moveTo(0,r.height*.62);for(let x=0;x<=r.width+60;x+=60)c.lineTo(x,r.height*.56-Math.sin(x*.012)*34-Math.abs(Math.sin(x*.05))*16);c.lineTo(r.width,r.height*.66);c.lineTo(0,r.height*.66);c.closePath();c.fill();
  const wy=r.height*.66;c.fillStyle='#2a8ea3';c.fillRect(0,wy,r.width,r.height-wy);c.fillStyle='#176477';c.fillRect(0,r.height-30,r.width,30);
  const gap=124,tot=paradeIds.reduce((s,id)=>s+(id==='osuke'?300:id==='king'?190:gap),0),base=r.height-16,sc=Math.max(.8,Math.min(1.25,r.height/640));
  let x=-220-(clock*46)%tot;
  for(let pass=0;pass<3;pass++)for(const id of paradeIds){
    const w=id==='osuke'?300:id==='king'?190:gap;
    if(x>-260&&x<r.width+260){c.save();c.translate(x,base);c.scale(sc,sc);A.drawActor(c,id,{t:clock+x*.01,sw:Math.sin(clock*8+x),atk:0,roll:clock*5});c.restore()}
    x+=w;
  }
  c.lineWidth=3;c.strokeStyle='rgba(255,255,255,.8)';c.beginPath();for(let q=0;q<=r.width;q+=14){const y=wy+Math.sin(q*.03+clock*2)*3;q?c.lineTo(q,y):c.moveTo(q,y)}c.stroke();
}
